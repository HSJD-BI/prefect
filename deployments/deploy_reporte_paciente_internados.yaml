name: procesar_reportes_mantenimiento
prefect-version: 3.6.25

build:
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.3.0
      image_name: docker.io/bihsjd/reporte-pacientes-internados
      tag: latest
      dockerfile: Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      id: push-image
      requires: prefect-docker>=0.3.0
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/HSJD-BI/reporte-pacientes-internados.git
      branch: "{{ prefect.variables.deployment_branch }}"
      credentials: "{{ prefect.blocks.github-credentials.bi-github }}"

deployments:
  - name: reporte-paciente-internados
    descripcion: ""
    flow_name: send_reporte_flow
    entrypoint: flows/send_reporte_flow.py:send_reporte_flow
    tags: ["Scraper", "Reporte"]
    work_pool:
      name: "vm_reportes_docker"
      job_variables:
        env:
          DB_SERVER: "10.0.0.235"
          DB_NAME: "DW"
          ACTIVITIES_DB: "PASTORAL"
          EMAIL_RECIPIENTS: "serviciodepastoral@sanjuandedios.org.ar,liliana.dominguez@sanjuandedios.org.ar,agustin.alegre@sanjuandedios.org.ar"
          ERROR_EMAIL_RECIPIENTS: "grupobi@sanjuandedios.org.ar"
    schedules:
      - cron: "30 8 * * *"
        timezone: "America/Buenos_Aires"
        active: true
      - cron: "00 13 * * *"
        timezone: "America/Buenos_Aires"
        active: true
      - cron: "00 16 * * *"
        timezone: "America/Buenos_Aires"
        active: true
